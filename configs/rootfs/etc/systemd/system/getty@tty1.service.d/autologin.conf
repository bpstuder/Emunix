# tty1 is the game console: log retrogamer in without a prompt so the session unit starts.
# The stock getty@.service ExecStart passes "-o '-p -- \u'" to login; combined with --autologin that
# makes login prompt for a password, so it is replaced rather than amended.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin retrogamer --noclear %I $TERM
