name: build
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint and unit-test
        run: |
          docker run --rm -v "$PWD:/work" -w /work archlinux:latest bash -c "
            pacman -Sy --noconfirm shellcheck minisign >/dev/null &&
            shellcheck -x build/*.sh tests/*.sh configs/rootfs/usr/local/bin/emunix-session \
              configs/rootfs/usr/local/bin/emunix-firstboot configs/rootfs/usr/local/bin/emunix-etc-overlay \
              configs/rootfs/usr/local/bin/emunix-slot configs/rootfs/usr/local/bin/emunix-health \
              configs/rootfs/etc/skel/.bash_profile &&
            bash -n build/*.sh tests/*.sh configs/rootfs/usr/local/bin/emunix-session \
              configs/rootfs/usr/local/bin/emunix-firstboot configs/rootfs/usr/local/bin/emunix-etc-overlay \
              configs/rootfs/usr/local/bin/emunix-slot configs/rootfs/usr/local/bin/emunix-health \
              configs/rootfs/etc/skel/.bash_profile &&
            bash tests/test-os-updater.sh &&
            bash tests/test-firstboot.sh &&
            bash tests/test-etc-overlay.sh &&
            bash tests/test-emunix-slot.sh &&
            bash tests/test-emunix-health.sh &&
            bash tests/test-emunix-update.sh &&
            bash tests/test-session.sh"
      - name: Build image
        run: |
          docker run --privileged -v "$PWD:/work" -w /work archlinux:latest \
            bash -c "pacman -Sy --noconfirm --needed gptfdisk dosfstools btrfs-progs e2fsprogs arch-install-scripts &&
                     bash build/build-image.sh"
      - name: Verify image
        run: |
          docker run --privileged -v "$PWD:/work" -w /work archlinux:latest \
            bash -c "pacman -Sy --noconfirm --needed gptfdisk e2fsprogs >/dev/null &&
                     bash build/verify-image.sh out/emunix-*-x86_64.img"
      - name: Boot image under QEMU
        run: |
          docker run --privileged -v "$PWD:/work" -w /work archlinux:latest \
            bash -c "pacman -Sy --noconfirm --needed qemu-system-x86 edk2-ovmf expect >/dev/null &&
                     bash build/boot-test.sh out/emunix-*-x86_64.img evidence/m0-boot.log"
      - name: Session test (ES-DE on a virtual GPU)
        run: |
          docker run --privileged -v "$PWD:/work" -w /work archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed qemu-system-x86 edk2-ovmf expect socat gptfdisk e2fsprogs >/dev/null &&
                     bash build/session-test.sh out/emunix-*-x86_64.img evidence"
      - name: First boot test (disk growth, /storage, shipped password)
        run: |
          docker run --privileged -v "$PWD:/work" -w /work archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed qemu-system-x86 edk2-ovmf expect socat gptfdisk e2fsprogs >/dev/null &&
                     bash build/firstboot-test.sh out/emunix-*-x86_64.img evidence"
      - name: Etc overlay test (writable /etc, survives reboot, slot switch)
        run: |
          docker run --privileged -v "$PWD:/work" -w /work archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed qemu-system-x86 edk2-ovmf expect socat e2fsprogs >/dev/null &&
                     bash build/etc-overlay-test.sh out/emunix-*-x86_64.img evidence"
      - name: Slot test (next/once, the kernel cmdline follows the slot)
        run: |
          docker run --privileged -v "$PWD:/work" -w /work archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed qemu-system-x86 edk2-ovmf expect socat e2fsprogs gptfdisk >/dev/null &&
                     bash build/slot-test.sh out/emunix-*-x86_64.img evidence"
      - name: Updater test (signed v1 -> v2, then a corrupt image aborts)
        run: |
          docker run --privileged -v "$PWD:/work" -w /work archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed qemu-system-x86 edk2-ovmf expect socat gptfdisk e2fsprogs openssl python minisign >/dev/null &&
                     bash build/updater-test.sh out/emunix-*-x86_64.img evidence"
      - name: Health test (two failed boots roll back, a normal boot does not)
        run: |
          docker run --privileged -v "$PWD:/work" -w /work archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed qemu-system-x86 edk2-ovmf expect socat gptfdisk e2fsprogs >/dev/null &&
                     bash build/health-test.sh out/emunix-*-x86_64.img evidence"
      - name: Upload session evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-evidence
          path: |
            evidence/m0-session.log
            evidence/m0-session-*.png
            evidence/m0-firstboot.log
            evidence/m0-etc-overlay.log
            evidence/m1-slot.log
            evidence/m2-updater.log
            evidence/m2-health.log
      - name: Upload checksum
        # The disk image is >10 GiB; release packaging (compressed .img.zst) is M4.
        uses: actions/upload-artifact@v7
        with:
          name: emunix-image
          path: out/*.sha256
